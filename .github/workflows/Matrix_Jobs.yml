name: "Example Workflow 1.2"

on:
  push:
    branches:
      - main

jobs:
  deploy-matrix:
    name: "Deploy ${{ matrix.environment }}"
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: ["dev", "qa"]
        #, "prod"]

    steps:
      - name: "Deploy ${{ matrix.environment }}"
        run: echo "Deploying $ENVIRONMENT"
        env:
          ENVIRONMENT: ${{ matrix.environment }}
