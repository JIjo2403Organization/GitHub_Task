name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: dotnet publish -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: files
          path: Studentregistration/publish

  deploy:
    needs: build
    uses: ./.github/workflows/Deploy.yml
    with:
      name: files
