name: Task 6 - Upload Artifact to GitHub Packages

on:
  workflow_dispatch:

jobs:

# ---------------- BUILD JOB ----------------
  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish Project
        run: dotnet publish Studentregistration -c Release -o publish

      - name: Upload Build Output as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: publish


# ---------------- DEPLOY JOB ----------------
  deploy:
    name: Deploy Job
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      # zip everything that was downloaded
      - name: Create ZIP from downloaded files
        run: zip -r final-build.zip .

      # push the zip file to GitHub Packages
      - name: Upload to GitHub Packages
        run: |
          dotnet nuget push final-build.zip \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --api-key ${{ secrets.GITHUB_TOKEN }}

      # just to verify in logs
      - name: Show files
        run: ls
