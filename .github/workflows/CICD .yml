name: CICD

on:
  workflow_dispatch:

jobs:

# ---------------- BUILD JOB ----------------
  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish Project
        run: dotnet publish Studentregistration -c Release -o publish

      - name: Upload Build Output as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: publish


# ---------------- DEPLOY JOB ----------------
  deploy:
    name: Deploy Job
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Deployment Folder
        run: mkdir deployed-folder

      - name: Copy Artifact Files to Deployment Folder
        run: cp -r ./* deployed-folder/ || true

      - name: Display Deployed Files
        run: ls deployed-folder
