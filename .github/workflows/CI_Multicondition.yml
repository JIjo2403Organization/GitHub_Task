name: CI_Multicondition 

on: 
    workflow_dispatch: 
  # pull_request: 
  #  branches:
     # - main
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [dev, qa, prod]
    outputs:
      version: ${{ steps.version.outputs.version }}


    steps:
      - uses: actions/checkout@v4

      - run: dotnet publish Studentregistration -c Release -o publish

      - name: Build Version
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT


      - name: Upload Artifact
        uses: JIjo2403Organization/GitHub_Task2/.github/actions/Upload_Artifact@main
        with:
          name: build-${{ matrix.environment }}
          path: publish
  deploy:
   name: Call CD Workflow
   needs: build
   uses: Jijo2403Organization/GitHub_Task2/.github/workflows/CD_multitask.yml@main

