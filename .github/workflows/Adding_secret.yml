name: Adding Secrets 
#Secrets and Variables (Task 4)
on:
  workflow_dispatch:

jobs:
  print-values:
    runs-on: windows-latest

    steps:
      - name: Print repository variable
        run: echo APP_NAME is ${{ vars.APP_NAME }}

      - name: Print secret length
        run: |
         $key = "${{ secrets.API_KEY }}"
         Write-Output "API_KEY length is $($key.Length)"
