name: Workflow_run_Sectets

on:
  workflow_run:
    workflows: ["Matrix"]  
    types:
      - completed

jobs:
  print-values:
    runs-on: windows-latest

    steps:
      - name: Print repository variable
        run: echo APP_NAME is ${{ vars.APP_NAME }}

      - name: Print secret length
        run: |
         $key = "${{ secrets.API_KEY }}"
         Write-Output "API_KEY length is $($key.Length)"
